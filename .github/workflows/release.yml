name: Release

# Push a tag such as v0.1.0 to attach the PDF to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended
          cd latex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          mv main.pdf sethucms-design-docs.pdf
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: latex/sethucms-design-docs.pdf
