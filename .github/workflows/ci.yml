name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Check documents and build the PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "docs/**/*.md" README.md
          fail: true
      - name: Validate the JSON schema and SQL file are present
        run: |
          python3 -m json.tool schemas/query-ast.schema.json > /dev/null
          test -s schemas/adapter.proto && test -s schemas/control-plane.sql
      - name: Build the PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended
          cd latex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          mv main.pdf sethucms-design-docs.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: design-docs-pdf
          path: latex/sethucms-design-docs.pdf
          retention-days: 14

  ci-ok:
    name: CI OK
    if: always()
    needs: [docs]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.docs.result }}" = "success" ]
