name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: database
    attributes:
      label: Database and version (for example PostgreSQL 16)
  - type: textarea
    id: logs
    attributes:
      label: Log lines or error body
      description: Please remove tokens, passwords and record contents first. Include the `requestId` if you have one.
